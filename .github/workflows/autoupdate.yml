name: CI

on:
  push:
    branches: [ "master", "main" ]
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  unciv-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compress PNG Images
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y oxipng
          find Images* -type f -name "*.png" -exec oxipng --opt max --strip all --alpha {} +

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Autoupdate
        continue-on-error: true
        run: |
          unciv_url=$(curl -s https://api.github.com/repos/yairm210/unciv/releases/latest | grep -o "http.*Unciv.jar")
          wget -q -O Unciv.jar $unciv_url
          java -jar Unciv.jar mod-ci

      - name: Remove Unciv executable
        run: rm -f Unciv.jar

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: Autoupdate
          title: "auto: Unciv autoupdate and image optimization"
          branch: "autoupdate-ci"
          
